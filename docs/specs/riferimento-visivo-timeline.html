<style>
:root{ --bg:#F4F3EE; --card:#FFF; --ink:#23271F; --mut:#6E6C63; --faint:#A3A199; --line:#E3E1D8;

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:"Instrument Sans",system-ui,sans-serif; font-feature-settings:"tnum";}
.wrap{max-width:960px; margin:0 auto; padding:28px 20px 60px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 26px;}

.sub{color:var(--mut); font-size:13px; margin:3px 0 0;}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
.chip{font-size:11.5px; font-weight:500; padding:3px 10px; border-radius:999px;}
svg{width:100%; height:auto; display:block; margin-top:14px;}
.leg{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--mut); align-items:center;}

.dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
